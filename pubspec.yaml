name: healthkicks_mobile
description: "HealthKicks Mobile Application - BLE-to-MQTT Gateway & Member Companion for Flutter"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # Bluetooth Low Energy Client
  flutter_blue_plus: ^1.34.0
  # AWS IoT Core MQTT Client
  mqtt_client: ^10.4.0
  # Permissions management (Bluetooth, Location, Notifications)
  permission_handler: ^11.3.1
  # State management & Dependency Injection
  flutter_riverpod: ^2.5.1
  # Serialization & Helpers
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  # Local storage for offline sync
  shared_preferences: ^2.2.3
  http: ^1.6.0
  flutter_secure_storage: ^11.1.1
  url_launcher: ^6.3.2
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
